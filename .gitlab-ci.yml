# CI GitLab — construction et publication de l'image Docker du FRONTEND.
#
# ⚠️ Ce job est FACULTATIF. La plateforme se déploie et fonctionne entièrement
#    avec `docker compose` — voir docs/DEPLOYMENT.md. Cette image ne sert qu'au
#    déploiement Kubernetes OPTIONNEL décrit dans deploy/frontend/.
#
#    Il est donc `when: manual` et `allow_failure: true` : le pipeline réussit
#    sans lui, et personne n'attend un runner qui n'existe peut-être pas.
#    Lancez-le à la demande depuis GitLab si vous déployez sur Kubernetes.
#
# $CI_REGISTRY*, $CI_REGISTRY_IMAGE et le token de job sont fournis par GitLab.

variables:
  KANIKO_VERSION: "1.24.0"

stages:
  - build

build-frontend:
  stage: build
  # Aucun tag imposé : le job tourne sur n'importe quel runner disponible.
  # Si votre organisation réserve des runners par tag, ajoutez-le ici, par ex. :
  #   tags: [k8s]
  image:
    # Registry interne hébergeant kaniko. Remplacer par le vôtre :
    #   KANIKO_IMAGE=<registry>/kaniko/executor
    name: ${KANIKO_IMAGE:-gcr.io/kaniko-project/executor}:v${KANIKO_VERSION}-debug
    entrypoint: [""]
  rules:
    # Ne construit que sur `main` (= prod) et si le frontend/son packaging change.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - deploy/frontend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  before_script:
    # Auth explicite au registry du projet (marche même sans DOCKER_AUTH_CONFIG global)
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > /kaniko/.docker/config.json
  script:
    # Tag = numéro de pipeline (croissant) surveillé par ArgoCD image-updater,
    # + `latest` par commodité. Image = racine du registry projet (pas de sous-chemin).
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/deploy/frontend/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_PIPELINE_IID"
      --destination "$CI_REGISTRY_IMAGE:latest"
