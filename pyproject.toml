[project]
name = "junon"
version = "0.1.0"
description = "Hybrid platform for piezometric forecasting combining Pastas transfer function-noise models and Darts deep learning forecasters."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicolas Ringuet", email = "ringuetnicolas2@gmail.com" }
]
requires-python = ">=3.12,<3.13"
keywords = [
    "hydrogeology",
    "groundwater",
    "time-series",
    "forecasting",
    "transfer-function-noise",
    "deep-learning",
    "pastas",
    "darts",
    "mlflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "pytorch-lightning>=2.0.0",
    "einops>=0.7.0",
    "darts>=0.32.0",
    "statsmodels>=0.14.0",
    "shap>=0.42.0",
    "timeshap>=1.0.0",
    "captum>=0.7.0",
    "optuna>=3.0.0",
    "tqdm>=4.65.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "codecarbon>=2.3.0",
    "tensorboard>=2.13.0",
    "optuna-dashboard>=0.13.0",
    "mlflow>=3.9.0",
    "pastas>=1.0.0",
    "lmfit>=1.2.0",
    "pymannkendall>=1.4.0",
    "ruptures>=1.1.0",
    "umap-learn>=0.5.0",
    "sqlparse>=0.4.0",
    "numba>=0.57.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchvision>=0.20.0",
]
cuda = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchvision>=0.20.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.0.0",
    "orjson>=3.10.0",
    "sse-starlette>=1.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9.0",
    "alembic>=1.13.0",
    "email-validator>=2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.urls]
Homepage = "https://scm.univ-tours.fr/ringuet/time-serie-explo"
Repository = "https://scm.univ-tours.fr/ringuet/time-serie-explo"
Issues = "https://scm.univ-tours.fr/ringuet/time-serie-explo/-/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
