name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    # Sans borne, un test qui pend occupe le runner six heures avant d'echouer.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv sync --extra cpu --extra api --extra dev

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Valeur jetable, propre au runner. api/config.py instancie Settings()
          # a l'import et refuse le defaut quand DEBUG est desactive : sans cette
          # variable, la collecte des tests echoue avant le premier test.
          JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef
          DB_PASSWORD: ci-only-throwaway-password
        run: uv run pytest tests/ -v --maxfail=5 --durations=10 -m "not integration and not slow"

  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
