# Single entry point for Junon: serves the React SPA and proxies /api/ to FastAPI.
# There used to be a second, standalone `nginx` service in front of this one. It was
# removed: it duplicated this reverse proxy, fought it for host port 49513, and its only
# unique payload (observatory-bridge.js, an iframe bridge to junondashboard) had become
# dead code once the Observatory was ported natively into this SPA. Its rate limiting,
# security headers and SSE settings were folded in here, where they now actually apply.

# limit_req_zone must live at http level; files in conf.d are included inside http {}.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
# nginx answers 503 by default when a zone overflows, which reads as "service down".
# The backend already returns 429 for its own rate limiting (api/auth/ratelimit.py),
# so align on 429 — same class of problem, same status code.
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSV dataset uploads can be tens of MB; matches FastAPI's max upload size.
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: ws: wss:; worker-src 'self' blob:;" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # nginx drops server-level add_header as soon as a location declares its own,
        # so the security headers have to be repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # API — proxy to the FastAPI backend so the SPA can use relative /api/v1 URLs.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;

        # SSE support — required for live training monitoring
        # (/api/v1/training/{task_id}/stream). Without these, nginx buffers the
        # stream and progress reaches the browser in bursts, or not at all.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
