# Frontend Junon — Deployment Kubernetes.
# Image à construire depuis deploy/frontend/Dockerfile et poussée sur le
# registry universitaire (ex : registry.scm.univ-tours.fr/ringuet/junon-frontend).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: junon-frontend
  labels:
    app: junon-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: junon-frontend
  template:
    metadata:
      labels:
        app: junon-frontend
    spec:
      containers:
        - name: frontend
          # Image produite par la CI (.gitlab-ci.yml → job build-frontend).
          # = $CI_REGISTRY_IMAGE/frontend. Utiliser :latest ou un tag SHA précis.
          image: registry.scm.univ-tours.fr/ringuet/time-serie-explo/frontend:latest
          ports:
            - containerPort: 80
          env:
            # ⚠️ PLACEHOLDER — remplacer <backend-ip> par l'adresse réelle du backend
            #    AVANT d'appliquer ce manifeste. Tel quel, le frontend ne joint rien.
            # Backend FastAPI sur <backend-host> (réseau interne universitaire).
            # IP LAN validée localement ; à confirmer avec la DSI (routage K8s → dib).
            - name: DIB_BACKEND
              value: "<backend-ip>:49514"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
