## ──────────────────────────────────────────────
##  Junon — environnement de DÉVELOPPEMENT isolé (branche dev)
##
##  Backend + base PostgreSQL + MLflow + front DÉDIÉS, totalement séparés de la
##  prod (aucune contamination des modèles / données / migrations).
##
##  Lancer (fichier auto-suffisant, GPU inclus → le -f explicite est OK ici) :
##    docker compose -p junon-dev -f docker-compose.dev.yml up -d --build
##  Arrêter :
##    docker compose -p junon-dev -f docker-compose.dev.yml down
##
##  Front dev : http://localhost:49518   |   API dev : http://localhost:49516
##  MLflow dev : http://localhost:49517
## ──────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: junon-postgres-dev
    hostname: junon-postgres-dev
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-junon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-junon}
      POSTGRES_DB: ${POSTGRES_DB:-junon_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-junon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: junon-redis-dev
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow-dev:
    image: ghcr.io/mlflow/mlflow:v3.8.1
    container_name: junon-mlflow-dev
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${MLFLOW_PORT_DEV:-49517}:5000"
    working_dir: /app
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///db/mlflow.db
        --default-artifact-root ./mlruns
        --allowed-hosts *
    environment:
      MLFLOW_TRACKING_URI: sqlite:///db/mlflow.db
    volumes:
      - mlflow_db_dev:/app/db
      - mlflow_artifacts_dev:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-dev:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BACKEND: cuda
    container_name: junon-backend-dev
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BACKEND_PORT_DEV:-49516}:8000"
    environment:
      - DB_HOST=junon-postgres-dev
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-junon}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-junon}
      - DB_NAME=${POSTGRES_DB:-junon_db}
      - BRGM_DB_HOST=brgm-postgres
      - BRGM_DB_PORT=5432
      - BRGM_DB_USER=postgres
      - BRGM_DB_PASSWORD=${BRGM_DB_PASSWORD:-}
      - BRGM_DB_NAME=postgres
      - REDIS_URL=redis://junon-redis-dev:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow-dev:5000
      - DEBUG=${DEBUG:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS_DEV:-http://localhost:49518}
      - DATA_DIR=/app/data
      - CHECKPOINTS_DIR=/app/checkpoints
      - RESULTS_DIR=/app/results
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - BACKEND=cuda
    volumes:
      # Données/artefacts DÉDIÉS au dev (séparés de la prod)
      - ./data-dev/prepared:/app/data/prepared
      - ./data/piezos:/app/data/piezos:ro
      - ./checkpoints-dev:/app/checkpoints
      - ./results-dev:/app/results
      - ./logs-dev:/app/logs
      - mlflow_artifacts_dev:/app/mlruns
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      mlflow-dev:
        condition: service_healthy
    networks:
      - default
      - brgm_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 24G

  frontend-dev:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: junon-frontend-dev
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Le front dev proxie /api vers le backend dev (réseau interne du projet dev)
      - BACKEND_URL=http://backend-dev:8000
    ports:
      - "${FRONTEND_PORT_DEV:-49518}:80"
    depends_on:
      - backend-dev
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  brgm_net:
    external: true
    name: hubeau_data_integration_default

volumes:
  postgres_data_dev:
  mlflow_db_dev:
  mlflow_artifacts_dev:
